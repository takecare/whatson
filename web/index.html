<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What's On · London</title>
    <meta name="description" content="Theatre, comedy, music, film and exhibitions from London venues, in one place." />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c8264f'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <a class="skip" href="#results">Skip to events</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="./">What's&nbsp;On <span>London</span></a>
        <label class="search">
          <span class="visually-hidden">Search</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
          <input id="q" type="search" placeholder="Search events, venues, areas…" autocomplete="off" />
        </label>
        <button id="open-filters" class="filters-toggle" type="button" aria-controls="filters" aria-expanded="false">
          Filters <span id="filter-count" class="badge" hidden></span>
        </button>
      </div>
    </header>

    <div class="wrap layout">
      <aside id="filters" class="filters" aria-label="Filters">
        <div class="filters-head">
          <h2>Filters</h2>
          <button id="close-filters" class="link-button" type="button">Done</button>
        </div>
        <div id="filter-controls"></div>
      </aside>

      <main id="results" tabindex="-1">
        <p class="loading">Loading events…</p>
      </main>
    </div>

    <footer class="site-footer">
      <div class="wrap">
        <h2>Sources</h2>
        <p class="muted" id="updated"></p>
        <div id="sources"></div>
        <p class="muted small">
          Listings are collected automatically from each venue's website and may be out of date. Always check with the
          venue before booking. <a href="https://github.com/takecare/whatson">Source code</a>.
        </p>
      </div>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
