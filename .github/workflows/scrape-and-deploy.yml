name: Scrape and deploy

# The schedule only checks hourly whether a scrape is due. How often events are
# actually collected is set by the repository variable SCRAPE_INTERVAL_HOURS
# (default 24; 0 pauses scheduled scraping). See README.md.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      scrape:
        description: Collect fresh events (untick to only rebuild the site)
        type: boolean
        default: true
      venue:
        description: Only scrape this venue id (optional; others keep their data)
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/scrape-and-deploy.yml"

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scrape: ${{ steps.decide.outputs.scrape }}
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SCRAPE: ${{ inputs.scrape }}
          INTERVAL: ${{ vars.SCRAPE_INTERVAL_HOURS || '24' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          case "$EVENT" in
            workflow_dispatch) scrape="$INPUT_SCRAPE"; deploy=true ;;
            push) scrape=false; deploy=true ;;
            schedule)
              if [ "$INTERVAL" = "0" ]; then
                echo "Scheduled scraping is paused (SCRAPE_INTERVAL_HOURS=0)."
                scrape=false
              else
                last=$(gh api "repos/$REPO/contents/status.json?ref=data" \
                  -H "Accept: application/vnd.github.raw" --jq .generated_at 2>/dev/null || true)
                if [ -z "$last" ]; then
                  echo "No previous scrape found."
                  scrape=true
                else
                  age_min=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 ))
                  # Allow 30 minutes of slack so an hourly check doesn't slip a whole hour.
                  due_min=$(( INTERVAL * 60 - 30 ))
                  echo "Last scrape $last ($age_min min ago); interval ${INTERVAL}h."
                  if [ "$age_min" -ge "$due_min" ]; then scrape=true; else scrape=false; fi
                fi
              fi
              deploy="$scrape" ;;
            *) scrape=false; deploy=false ;;
          esac
          echo "scrape=$scrape deploy=$deploy"
          echo "scrape=$scrape" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    if: needs.plan.outputs.scrape == 'true'
    # Set the repository variable SCRAPE_RUNS_ON to ["self-hosted","whatson"] to run
    # this job on the self-hosted runner instead of GitHub's machines.
    runs-on: ${{ fromJSON(vars.SCRAPE_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch previous data
        run: |
          mkdir -p previous
          if git fetch --depth=1 origin data; then
            git archive FETCH_HEAD | tar -x -C previous
          fi
      - uses: astral-sh/setup-uv@v6
      - name: Scrape
        working-directory: scraper
        env:
          VENUE: ${{ inputs.venue }}
        run: uv run whatson scrape --out ../out --previous ../previous ${VENUE:+--venue "$VENUE"}
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: out/
          retention-days: 7

  publish:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: ${{ runner.temp }}/out
      - name: Commit to the data branch
        env:
          OUT: ${{ runner.temp }}/out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin data; then
            git checkout -q -B data FETCH_HEAD
          else
            git checkout -q --orphan data
          fi
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$OUT"/*.json .
          git add -A
          git commit -qm "Update listings $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin data

  deploy:
    needs: [plan, publish]
    # Also runs when publish was skipped (a push to main only rebuilds the site).
    if: >-
      always() && needs.plan.outputs.deploy == 'true' &&
      needs.publish.result != 'failure' && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        run: |
          mkdir -p web/public/data
          if git fetch --depth=1 origin data; then
            git archive FETCH_HEAD | tar -x -C web/public/data
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
